<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Cursillo VIBE · App</title>
<meta name="theme-color" content="#FB8500">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icons/icon-192.png">
<meta name="description" content="App del Cursillo VIBE: inscripción, cuotas, notas y asistencia.">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="VIBE">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Figtree:wght@400;500;600;700&family=Montserrat:wght@600;700;800&display=swap" rel="stylesheet">
<style>
/* Layout: app shell — sidebar on desktop, bottom tabs on phone; dense rows inside bordered cards; orange only for brand and focus */
:root{
  --bg:#F6F5F2; --surface:#FFFFFF; --sunken:#EFEDE8; --ink:#17140F; --muted:#68625A; --line:#E4E0D9;
  --accent:#FB8500; --accent-ink:#9A5200; --accent-soft:#FFF0DC;
  --ok:#1E7D46; --ok-soft:#E2F2E7; --bad:#BF3328; --bad-soft:#FBE5E2; --pend:#4A5A7C; --pend-soft:#E7EBF3; --late:#9A6E00; --late-soft:#F7EDD2;
  --font-display:"Montserrat", "Segoe UI", system-ui, sans-serif;
  --font-body:"Figtree", "Segoe UI", system-ui, sans-serif;
  --r:12px; --shadow:0 1px 2px rgba(23,20,15,.05), 0 6px 20px rgba(23,20,15,.06);
  color-scheme:light;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#121110; --surface:#1A1917; --sunken:#23211E; --ink:#F3F0EB; --muted:#A49E95; --line:#302D29;
    --accent:#FF9426; --accent-ink:#FFB565; --accent-soft:#3A2510;
    --ok:#56C485; --ok-soft:#163322; --bad:#FF7A6C; --bad-soft:#3B1B17; --pend:#A3B5DA; --pend-soft:#1F2637; --late:#E8BA45; --late-soft:#352A0F;
    --shadow:0 1px 2px rgba(0,0,0,.3), 0 6px 20px rgba(0,0,0,.25);
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#121110; --surface:#1A1917; --sunken:#23211E; --ink:#F3F0EB; --muted:#A49E95; --line:#302D29;
  --accent:#FF9426; --accent-ink:#FFB565; --accent-soft:#3A2510;
  --ok:#56C485; --ok-soft:#163322; --bad:#FF7A6C; --bad-soft:#3B1B17; --pend:#A3B5DA; --pend-soft:#1F2637; --late:#E8BA45; --late-soft:#352A0F;
  --shadow:0 1px 2px rgba(0,0,0,.3), 0 6px 20px rgba(0,0,0,.25);
  color-scheme:dark;
}
*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{background:var(--bg);color:var(--ink);font:15px/1.45 var(--font-body);-webkit-font-smoothing:antialiased}
button,input,select,textarea{font:inherit;color:inherit}
h1,h2,h3{font-family:var(--font-display);margin:0;text-wrap:balance;letter-spacing:-.01em}
h1{font-size:24px;font-weight:800}
h2{font-size:16px;font-weight:700}
h3{font-size:14px;font-weight:700}
small,.muted{color:var(--muted)}
.num{font-family:var(--font-display);font-variant-numeric:tabular-nums;font-weight:700}
a{color:var(--accent-ink)}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
@media (prefers-reduced-motion: reduce){*{transition:none!important;animation:none!important}}

/* shell */
#app{display:grid;grid-template-columns:236px 1fr;min-height:100%}
#app.solo{display:block}
#side{position:sticky;top:0;height:100vh;background:var(--surface);border-right:1px solid var(--line);display:flex;flex-direction:column;padding:20px 14px;gap:18px;overflow-y:auto}
#topbar,#tabs{display:none}
#app.solo #side,#app.solo #topbar,#app.solo #tabs{display:none!important}
.brand{display:flex;align-items:baseline;gap:8px;padding:0 8px}
.wm{font-family:var(--font-display);font-weight:800;font-size:26px;letter-spacing:.02em;line-height:1}
.logo{display:block;height:auto;max-width:100%}
.logo.osc{display:none}
@media (prefers-color-scheme: dark){ .logo.cla{display:none} .logo.osc{display:block} }
.brand .logo{width:168px}
.auth-card .logo{width:230px}
.linkbox{display:flex;gap:8px;align-items:center;background:var(--sunken);border-radius:10px;padding:8px 10px;font-size:13px;overflow-wrap:anywhere}
.wm i{font-style:normal;color:var(--accent)}
.wm-sub{font-family:var(--font-display);font-weight:600;font-size:13px;color:var(--muted);text-transform:uppercase;letter-spacing:.12em}
.nav{display:flex;flex-direction:column;gap:2px}
.nav button{display:flex;align-items:center;gap:12px;border:0;background:none;padding:10px 12px;border-radius:10px;cursor:pointer;font-weight:600;color:var(--muted);text-align:left;position:relative}
.nav button:hover{background:var(--sunken);color:var(--ink)}
.nav button[aria-current="page"]{background:var(--accent-soft);color:var(--ink)}
.nav button[aria-current="page"] svg{color:var(--accent-ink)}
.badge{margin-left:auto;background:var(--bad);color:#fff;font-size:11px;font-weight:800;min-width:20px;height:20px;border-radius:99px;display:inline-flex;align-items:center;justify-content:center;padding:0 6px;font-family:var(--font-display)}
.side-foot{margin-top:auto;padding:12px 8px 0;border-top:1px solid var(--line);display:flex;flex-direction:column;gap:6px}
.role{display:inline-flex;align-self:flex-start;font-size:12px;font-weight:700;padding:3px 9px;border-radius:999px;background:var(--sunken);color:var(--muted)}
svg.i{width:20px;height:20px;flex:none;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
main{padding:28px 32px 48px;max-width:1160px;width:100%;display:flex;flex-direction:column;gap:20px;min-width:0}

@media (max-width: 860px){
  #app{grid-template-columns:1fr}
  #side{display:none}
  #topbar{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:10px 16px;background:var(--surface);border-bottom:1px solid var(--line);position:sticky;top:0;z-index:20}
  #tabs{display:grid;grid-auto-flow:column;grid-auto-columns:1fr;position:fixed;left:0;right:0;bottom:0;background:var(--surface);border-top:1px solid var(--line);z-index:30;padding:4px 4px calc(4px + env(safe-area-inset-bottom))}
  #tabs button{border:0;background:none;display:flex;flex-direction:column;align-items:center;gap:2px;padding:6px 2px;font-size:11px;font-weight:600;color:var(--muted);border-radius:10px;cursor:pointer;position:relative}
  #tabs button[aria-current="page"]{color:var(--ink)}
  #tabs button[aria-current="page"] svg{color:var(--accent-ink)}
  #tabs .badge{position:absolute;top:0;right:calc(50% - 22px);min-width:16px;height:16px;font-size:10px}
  main{padding:18px 16px 96px;gap:16px}
  h1{font-size:21px}
}
.tb-r{display:flex;align-items:center;gap:8px}
.icon-btn{border:1px solid var(--line);background:var(--surface);border-radius:10px;width:38px;height:38px;display:inline-flex;align-items:center;justify-content:center;cursor:pointer;color:var(--ink)}

/* page head */
.ph{display:flex;align-items:flex-end;justify-content:space-between;gap:12px;flex-wrap:wrap}
.ph p{margin:4px 0 0;color:var(--muted)}
.actions{display:flex;gap:8px;flex-wrap:wrap}
.back{display:inline-flex;align-items:center;gap:6px;border:0;background:none;color:var(--muted);font-weight:600;cursor:pointer;padding:4px 0}
.back:hover{color:var(--ink)}

/* buttons */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;border:1px solid var(--line);background:var(--surface);padding:9px 14px;border-radius:10px;font-weight:600;cursor:pointer;text-decoration:none;color:var(--ink);white-space:nowrap;min-height:40px}
.btn:hover{border-color:var(--muted)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:#17140F}
.btn.primary:hover{filter:brightness(.96)}
.btn.dark{background:var(--ink);border-color:var(--ink);color:var(--bg)}
.btn.danger{color:var(--bad)}
.btn.ghost{border-color:transparent;background:none}
.btn.sm{padding:5px 10px;min-height:32px;font-size:13px;border-radius:8px}
.btn.block{width:100%}
.btn[disabled],.btn.disabled{opacity:.45;pointer-events:none}
.btn svg.i{width:18px;height:18px}
.btn.wa{color:var(--ok)}

/* cards and sections */
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);min-width:0}
.card-h{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:14px 16px;border-bottom:1px solid var(--line);flex-wrap:wrap}
.card-b{padding:14px 16px}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:20px}
@media (max-width: 1000px){.grid2{grid-template-columns:1fr}}

.kpis{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px}
@media (max-width: 860px){.kpis{grid-template-columns:repeat(2,minmax(0,1fr))}}
.kpi{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:14px 16px;display:flex;flex-direction:column;gap:4px;position:relative;overflow:hidden}
.kpi .l{font-size:12px;font-weight:700;color:var(--muted);text-transform:uppercase;letter-spacing:.06em}
.kpi .v{font-family:var(--font-display);font-weight:800;font-size:24px;font-variant-numeric:tabular-nums;line-height:1.15;overflow-wrap:anywhere}
.kpi .s{font-size:13px;color:var(--muted)}
.kpi.bad{border-color:color-mix(in srgb,var(--bad) 35%,var(--line))}
.kpi.bad .v{color:var(--bad)}
.kpi.bad::before{content:"";position:absolute;left:0;top:0;bottom:0;width:4px;background:var(--bad)}

/* rows */
.rows{display:flex;flex-direction:column}
.row{display:grid;grid-template-columns:minmax(0,1fr) auto;align-items:center;gap:10px 14px;padding:11px 16px;border-top:1px solid var(--line)}
.row:first-child{border-top:0}
.row.click{cursor:pointer}
.row.click:hover{background:var(--sunken)}
.row .t{font-weight:600;overflow-wrap:anywhere}
.row .t small{display:block;font-weight:400}
.row .r{display:flex;align-items:center;gap:8px;justify-content:flex-end;flex-wrap:wrap}
.empty{padding:28px 16px;text-align:center;color:var(--muted)}
.empty b{display:block;color:var(--ink);margin-bottom:4px;font-family:var(--font-display)}

/* table */
.tw{overflow-x:auto}
table{border-collapse:collapse;width:100%;font-size:14px}
th{font-size:12px;text-transform:uppercase;letter-spacing:.05em;color:var(--muted);font-weight:700;text-align:left;padding:9px 12px;border-bottom:1px solid var(--line);white-space:nowrap;background:var(--surface)}
td{padding:10px 12px;border-bottom:1px solid var(--line);vertical-align:middle}
tr:last-child td{border-bottom:0}
td.n,th.n{text-align:right;font-variant-numeric:tabular-nums}
tr.click{cursor:pointer}
tr.click:hover td{background:var(--sunken)}

/* pills */
.pill{display:inline-flex;align-items:center;gap:5px;font-size:12px;font-weight:700;padding:3px 9px;border-radius:999px;white-space:nowrap;background:var(--sunken);color:var(--muted)}
.pill.ok{background:var(--ok-soft);color:var(--ok)}
.pill.bad{background:var(--bad-soft);color:var(--bad)}
.pill.pend{background:var(--pend-soft);color:var(--pend)}
.pill.late{background:var(--late-soft);color:var(--late)}
.pill.acc{background:var(--accent-soft);color:var(--accent-ink)}
.bad-t{color:var(--bad)} .ok-t{color:var(--ok)}

/* bars */
.bar{height:6px;border-radius:99px;background:var(--sunken);overflow:hidden;min-width:60px}
.bar>i{display:block;height:100%;background:var(--ok);border-radius:99px}
.bar.mid>i{background:var(--late)} .bar.low>i{background:var(--bad)}

/* chips / filters */
.chips{display:flex;gap:8px;flex-wrap:wrap}
.chip{border:1px solid var(--line);background:var(--surface);padding:7px 12px;border-radius:999px;font-weight:600;font-size:14px;cursor:pointer;color:var(--ink)}
.chip[aria-pressed="true"]{background:var(--ink);border-color:var(--ink);color:var(--bg)}
.chip[disabled]{opacity:.45;cursor:default}
.filters{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.inp,select.inp,textarea.inp{border:1px solid var(--line);background:var(--surface);border-radius:10px;padding:9px 12px;min-height:40px;width:100%}
textarea.inp{min-height:90px;resize:vertical;line-height:1.45}
.inp:focus{outline:2px solid var(--accent);outline-offset:-1px;border-color:transparent}
.search{position:relative;flex:1 1 220px}
.search svg{position:absolute;left:11px;top:50%;transform:translateY(-50%);color:var(--muted)}
.search .inp{padding-left:38px}
.filters select.inp{width:auto}
.chk{display:inline-flex;align-items:center;gap:8px;font-weight:600;font-size:14px;cursor:pointer}
.chk input{width:18px;height:18px;accent-color:var(--accent)}

.tabsbar{display:flex;gap:4px;background:var(--sunken);padding:4px;border-radius:12px;align-self:flex-start;flex-wrap:wrap}
.tabsbar button{border:0;background:none;padding:8px 14px;border-radius:9px;font-weight:700;color:var(--muted);cursor:pointer}
.tabsbar button[aria-pressed="true"]{background:var(--surface);color:var(--ink);box-shadow:var(--shadow)}

/* forms */
.form{display:grid;grid-template-columns:1fr 1fr;gap:12px 14px}
.form .full{grid-column:1/-1}
.fld{display:flex;flex-direction:column;gap:5px;min-width:0}
.fld label{font-size:13px;font-weight:700;color:var(--muted)}
.fld label .req{color:var(--bad)}
.fld .hint{font-size:12px;color:var(--muted)}
.fsec{grid-column:1/-1;font-family:var(--font-display);font-weight:700;font-size:13px;text-transform:uppercase;letter-spacing:.08em;color:var(--accent-ink);padding-top:8px;border-top:1px solid var(--line);margin-top:4px}
.form .fsec:first-child{border-top:0;padding-top:0;margin-top:0}
@media (max-width: 560px){.form{grid-template-columns:1fr}}
.err{color:var(--bad);font-size:13px;font-weight:600}
.inp.inv{border-color:var(--bad)}

/* modal */
.ov{position:fixed;inset:0;background:rgba(15,12,8,.45);z-index:100;display:flex;align-items:flex-start;justify-content:center;padding:40px 16px;overflow-y:auto}
.dlg{background:var(--surface);border-radius:16px;width:100%;max-width:620px;box-shadow:0 20px 60px rgba(0,0,0,.25);display:flex;flex-direction:column;border:1px solid var(--line)}
.dlg.wide{max-width:900px}
.dlg.narrow{max-width:440px}
.dlg-h{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:16px 20px;border-bottom:1px solid var(--line)}
.dlg-b{padding:18px 20px;display:flex;flex-direction:column;gap:14px}
.dlg-f{display:flex;justify-content:flex-end;gap:8px;padding:14px 20px;border-top:1px solid var(--line);flex-wrap:wrap}
.x{border:0;background:none;cursor:pointer;color:var(--muted);padding:4px;border-radius:8px}
.x:hover{background:var(--sunken);color:var(--ink)}
@media (max-width: 560px){.ov{padding:0;align-items:flex-end}.dlg{border-radius:16px 16px 0 0;max-height:94vh;overflow-y:auto}}

/* toasts */
#toasts{position:fixed;left:50%;transform:translateX(-50%);bottom:24px;z-index:200;display:flex;flex-direction:column;gap:8px;align-items:center;pointer-events:none}
.toast{background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:10px;font-weight:600;box-shadow:var(--shadow);max-width:90vw}
.toast.error{background:var(--bad);color:#fff}
@media (max-width: 860px){#toasts{bottom:84px}}

/* banner */
.banner{border:1px solid var(--line);background:var(--surface);border-left:4px solid var(--accent);padding:12px 14px;border-radius:10px;font-size:14px}
.banner.bad{border-left-color:var(--bad)}
.banner.ok{border-left-color:var(--ok)}
.banner.click{cursor:pointer;display:flex;align-items:center;justify-content:space-between;gap:12px}

/* attendance */
.att{display:flex;gap:6px}
.att button{width:40px;height:38px;border-radius:9px;border:1px solid var(--line);background:var(--surface);font-family:var(--font-display);font-weight:800;cursor:pointer;color:var(--muted)}
.att button[aria-pressed="true"][data-v="P"]{background:var(--ok);border-color:var(--ok);color:#fff}
.att button[aria-pressed="true"][data-v="A"]{background:var(--bad);border-color:var(--bad);color:#fff}
.att button[aria-pressed="true"][data-v="T"]{background:var(--late);border-color:var(--late);color:#fff}
.att button[aria-pressed="true"][data-v="J"]{background:var(--pend);border-color:var(--pend);color:#fff}
.att .nb{width:36px;display:grid;place-items:center;font-weight:400}
.att .nb svg{width:16px;height:16px}
.att .nb.on{border-color:var(--accent);background:var(--accent-soft);color:var(--accent-ink)}
.row .t small.na{color:var(--accent-ink);font-weight:600;margin-top:2px}
.nclase{padding:12px 16px;border-top:1px solid var(--line);display:grid;gap:8px}
.nclase label{font-weight:700;font-size:14px}
.nclase textarea.inp{min-height:70px}
.nclase .ro{white-space:pre-wrap;font-size:14px}
.nota-l{font-size:13px;font-weight:400;color:var(--accent-ink);white-space:pre-wrap;margin-top:2px}
.savebar{position:sticky;bottom:0;z-index:10;display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap;padding:12px 16px;background:var(--surface);border-top:1px solid var(--line);border-radius:0 0 var(--r) var(--r)}
@media (max-width: 860px){.savebar{bottom:64px}}
.cnt{display:flex;gap:12px;font-size:13px;font-weight:700;flex-wrap:wrap}
.cnt span{display:inline-flex;align-items:center;gap:5px}
.dot{width:9px;height:9px;border-radius:3px;display:inline-block}
.d-P{background:var(--ok)} .d-A{background:var(--bad)} .d-T{background:var(--late)} .d-J{background:var(--pend)} .d-0{background:var(--sunken);border:1px solid var(--line)}
.mx td,.mx th{padding:6px 8px;text-align:center}
.mx td:first-child,.mx th:first-child{text-align:left;position:sticky;left:0;background:var(--surface);z-index:1;min-width:170px}
.mx .c{display:inline-flex;width:24px;height:24px;border-radius:6px;align-items:center;justify-content:center;font-weight:800;font-size:12px;color:#fff;font-family:var(--font-display)}
.mx .c.e{background:var(--sunken);color:var(--muted)}
.mx th button{border:0;background:none;color:inherit;font:inherit;cursor:pointer;text-transform:none;letter-spacing:0}
.strip{display:flex;gap:3px;flex-wrap:wrap}
.strip i{width:12px;height:12px;border-radius:3px}

/* group cards */
.gcards{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:14px}
.gcard{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:16px;display:flex;flex-direction:column;gap:10px;cursor:pointer;text-align:left}
.gcard:hover{border-color:var(--muted)}
.gcard .meta{display:grid;grid-template-columns:auto 1fr auto;gap:6px 10px;align-items:center;font-size:13px}

/* detail */
.dl{display:grid;grid-template-columns:max-content 1fr;gap:8px 16px;font-size:14px;margin:0}
.dl dt{color:var(--muted);font-weight:600}
.dl dd{margin:0;overflow-wrap:anywhere}

/* steps */
.steps{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:14px}
@media (max-width: 860px){.steps{grid-template-columns:1fr}}
.step{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:18px;display:flex;flex-direction:column;gap:10px;align-items:flex-start}
.step .k{font-family:var(--font-display);font-weight:800;font-size:13px;color:var(--accent-ink)}

/* login */
.auth{min-height:100vh;display:flex;align-items:center;justify-content:center;padding:24px 16px}
.auth-card.ev{max-width:560px}
.evc{border-top:1px solid var(--line);padding-top:16px;display:grid;gap:12px}
.evc h2{margin:0;font-size:17px;display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.evq{display:grid;gap:6px}
.evq>b{font-size:14px}
.evq .chips{gap:6px}
.evq .chip{min-height:38px}
.ev-ok{color:var(--ok);font-weight:700}
.stars{color:var(--accent);letter-spacing:1px;white-space:nowrap}
.auth-card{width:100%;max-width:400px;background:var(--surface);border:1px solid var(--line);border-radius:18px;padding:28px 24px;display:flex;flex-direction:column;gap:16px;box-shadow:var(--shadow)}
.auth-card .wm{font-size:40px}
.auth-card form{display:flex;flex-direction:column;gap:12px}
.linkbtn{border:0;background:none;color:var(--accent-ink);font-weight:600;cursor:pointer;padding:0;text-align:left}
.onb{max-width:760px;margin:0 auto;width:100%;display:flex;flex-direction:column;gap:18px}

/* receipt */
.rcb{background:#fff;color:#17140F;border:1px solid #E4E0D9;border-radius:12px;padding:22px;display:flex;flex-direction:column;gap:14px}
.rcb-top{display:flex;justify-content:space-between;align-items:flex-start;gap:12px;border-bottom:3px solid #FB8500;padding-bottom:14px}
.rcb-top img{max-height:56px;max-width:180px}
.rcb-top .wm{font-size:30px;color:#17140F}
.rcb-no{text-align:right;font-family:var(--font-display);font-weight:700;font-size:12px;letter-spacing:.1em;color:#68625A}

.rcb-sign{display:flex;justify-content:space-between;align-items:flex-end;gap:12px;margin-top:10px;font-size:12px;color:#68625A}
.rcb-sign .ln{border-top:1px solid #17140F;padding-top:4px;min-width:160px;text-align:center}
@media print{
  body.print-rcb #app, body.print-rcb #toasts, body.print-rcb .dlg-h, body.print-rcb .dlg-f, body.print-rcb .rcb-extra{display:none!important}
  body.print-rcb .ov{position:static;background:none;padding:0}
  body.print-rcb .dlg{box-shadow:none;border:0;max-width:none}
}

.gen{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:8px;align-items:end;background:var(--sunken);padding:12px;border-radius:10px}

.spark{display:block}

.sgrid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px}

  const U = ['','uno','dos','tres','cuatro','cinco','seis','siete','ocho','nueve','diez','once','doce','trece','catorce','quince','dieciséis','diecisiete','dieciocho','diecinueve','veinte','veintiuno','veintidós','veintitrés','veinticuatro','veinticinco','veintiséis','veintisiete','veintiocho','veintinueve'];

function listasHoy() {
  const t = hoy(), out = [], ya = (g, tt) => out.some(x => x.g.id === g && x.t === tt);
  if (isProfe() && S.miProf) {
    Object.values(S.clases).filter(c => c.fecha === t && (c.profesor_id === S.miProf.id || c.dictada_por === S.miProf.id) && S.grupos[c.grupo_id]).forEach(c => { if (!ya(c.grupo_id, c.turno)) out.push({ g: S.grupos[c.grupo_id], t: c.turno }); });
    Object.values(S.cambios || {}).filter(x => x.fecha === t && x.profesor_id === S.miProf.id && x.estado !== 'rechazado' && S.grupos[x.grupo_id]).forEach(x => { if (!ya(x.grupo_id, x.turno)) out.push({ g: S.grupos[x.grupo_id], t: x.turno }); });
  }
  const base = isProfe() ? [] : gruposActivos();
  base.forEach(g => { const tp = turnosProg(g, t); const lista = tp.length ? tp : (Object.values(g.dias || {}).some(c => c && c !== '-') ? [] : ['Mañana']); lista.forEach(tt => { if (!ya(g.id, tt)) out.push({ g, t: tt }); }); });

}

  let h = `<div class="filters wkh"><button class="btn sm" data-act="hor-sem" data-d="-7" aria-label="Semana anterior">‹</button><span class="lbl">${rangoSem(l)}</span><button class="btn sm" data-act="hor-sem" data-d="7" aria-label="Semana siguiente">›</button>${l !== lunesDe(hoy()) ? `<button class="btn sm ghost" data-act="hor-sem" data-d="0">Esta semana</button>` : ''}</div>`;

  const cls = clasesSem(l);
  if (isAdmin() && S.sem && S.sem.lunes === l && S.borr && (!S.sem.publicada || S.borr.generado > S.sem.publicada))
    h += `<div class="banner click" data-act="hortab" data-v="armar"><span>${S.sem.publicada ? 'Cambiaste el armado de esta semana y todavía no lo volviste a publicar.' : 'El horario de esta semana está armado pero sin publicar: profes y alumnos todavía no lo ven.'}</span><span class="btn sm primary">Ir a publicar</span></div>`;

  const pasadas = cls.filter(c => c.materia && c.materia !== 'examen' && c.fecha < hoy());

function evAgg(rows) {
  const avg = k => { const v = rows.map(r => r[k]).filter(x => x != null); return v.length ? v.reduce((a, b) => a + b, 0) / v.length : null; };
  const pct = (k, ok, excl = []) => { const v = rows.map(r => r[k]).filter(x => x != null && !excl.includes(x)); return v.length ? Math.round(100 * v.filter(x => ok.includes(x)).length / v.length) : null; };
  return { n: rows.length, gen: avg('general'), ent: avg('entendio'), punt: pct('puntual', ['si']), dud: pct('dudas', ['si'], ['sin_dudas']), term: pct('termino', ['completa']) };
}

const fPct = (x, b = 70) => x == null ? '<span class="muted">—</span>' : `<span class="${x < b ? 'bad-t' : ''}">${x}%</span>`;
const estrellas = n => '★'.repeat(n) + '☆'.repeat(5 - n);

const normN = t => (t || '').toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g, '').split(/[^a-zñ]+/).filter(w => w.length > 2);
function cuentasSinFila() {
  const ligadas = new Set(Object.values(S.prof).map(p => p.user_id).filter(Boolean));
  return Object.values(S.perfiles || {}).filter(u => u.rol === 'profe' && u.activo && !ligadas.has(u.id)).sort((a, b) => (a.nombre || a.email).localeCompare(b.nombre || b.email, 'es'));
}
function cardCuentasSinFila() {
  const cs = cuentasSinFila(); if (!cs.length) return '';
  const libres = Object.values(S.prof).filter(p => !p.user_id).sort((a, b) => (b.activo - a.activo) || a.nombre.localeCompare(b.nombre, 'es'));
  const mejor = u => { const w = new Set([...normN(u.nombre), ...normN(u.email.split('@')[0])]); let best = null, bs = 0;
    libres.forEach(p => { const sc = normN(p.nombre).filter(x => w.has(x) || [...w].some(y => y.includes(x))).length; if (sc > bs) { bs = sc; best = p.id; } }); return best; };
  return `<div class="card" style="border-color:var(--late)"><div class="card-h"><div><h2>Cuentas de profe sin vincular</h2><small>Entraron con un correo que no está en el plantel, por eso no ven su horario ni su disponibilidad.</small></div>${pill(cs.length, 'pend')}</div><div class="rows">${cs.map(u => { const m = mejor(u);
    return `<div class="row"><div class="t">${esc(u.nombre || '—')}<small>${esc(u.email)}</small></div><div class="r" style="flex-wrap:wrap"><select class="inp" id="vinc-${esc(u.id)}" style="width:auto;max-width:220px" aria-label="Fila del plantel para ${esc(u.email)}"><option value="">Vincular a…</option>${libres.map(p => `<option value="${esc(p.id)}" ${p.id === m ? 'selected' : ''}>${esc(p.nombre)}${p.activo ? '' : ' (inactivo)'}${p.email ? ' · ' + esc(p.email) : ''}</option>`).join('')}</select><button class="btn sm primary" data-act="vinc-profe" data-u="${esc(u.id)}">Vincular</button></div></div>`; }).join('')}</div><div class="card-b"><small class="muted">Al vincular, la fila conserva sus puntajes y pasa a tener el correo de la cuenta. También se engancha sola si le ponés a la fila el mismo correo de la cuenta.</small></div></div>`;
}

/* pago a profes (dirección) */
function pagoDelMes(mes) {
  const d0 = mes + '-01', d1 = addDays(addMonths(d0, 1), -1);
  const cls = Object.values(S.clases).filter(c => c.fecha >= d0 && c.fecha <= d1); const by = {};
  cls.filter(c => cuentaPago(c) || (c.dictada_por && c.materia === 'examen')).forEach(c => (by[c.dictada_por] ||= []).push(c));
  const filas = Object.entries(by).map(([pid, l]) => { const n = l.filter(c => c.materia !== 'examen').length; const m = num(S.punt[pid]?.monto_clase);
    return { pid, l: l.sort((a, b) => a.fecha.localeCompare(b.fecha) || a.turno.localeCompare(b.turno)), n, ex: l.length - n, m, tot: n * m }; })
    .sort((a, b) => b.tot - a.tot || profN(a.pid).localeCompare(profN(b.pid), 'es'));
  const sinLista = cls.filter(c => !c.dictada_por && c.materia && c.materia !== 'examen' && c.fecha < hoy()).sort((a, b) => a.fecha.localeCompare(b.fecha));
  const sinAprobar = cls.filter(c => c.dictada_por && c.materia !== 'examen' && c.dictada_por !== c.profesor_id).sort((a, b) => a.fecha.localeCompare(b.fecha));
  return { d0, d1, filas, sinLista, sinAprobar };
}

  const { filas, sinLista, sinAprobar } = pagoDelMes(mes);
  h += `<div class="kpis">${kpi('Total a pagar', money(sum(filas.map(f => f.tot))), cap(MESES[+mes.slice(5) - 1]) + ' ' + mes.slice(0, 4))}${kpi('Clases dadas', fmtN(sum(filas.map(f => f.n))), filas.length + ' profe' + (filas.length === 1 ? '' : 's'))}${kpi('Sin aprobar', sinAprobar.length, 'cambios que todavía no aprobaste', sinAprobar.length ? 'bad' : '')}${kpi('Clases sin lista', sinLista.length, 'ya pasaron y nadie llamó lista', sinLista.length ? 'bad' : '')}</div>`;
  if (sinAprobar.length) h += `<div class="card"><div class="card-h"><h2>Clases dadas con cambio sin aprobar</h2><button class="btn sm" data-act="hortab" data-v="cambios">Ir a Cambios</button></div><div class="rows">${sinAprobar.map(c => { const x = cambioDe(c); return `<div class="row"><div class="t">${dkDe(c.fecha)} ${dm(c.fecha)} · ${esc(c.turno)} · ${esc(gName(c.grupo_id))}<small>La dio ${esc(profN(c.dictada_por))}${c.profesor_id ? ' · le tocaba a ' + esc(primerN(c.profesor_id)) : ' · sin profe en el horario'}</small></div><div class="r">${x ? pill(ESTADO_CAMBIO[x.estado][0], ESTADO_CAMBIO[x.estado][1]) : ''}${x?.estado === 'pendiente' ? `<button class="btn sm primary" data-act="cambio-resolver" data-id="${esc(x.id)}" data-v="1">Aprobar</button>` : ''}</div></div>`; }).join('')}</div><div class="card-b"><small class="muted">No suman al total hasta que las apruebes.</small></div></div>`;
  h += `<div class="card"><div class="card-h"><h2>Por profe</h2><button class="btn sm" data-act="pago-exp">${ic('download')}Exportar detalle</button></div><div class="tw"><table><thead><tr><th>Profe</th><th class="n">Clases</th><th class="n">Exámenes</th><th class="n">Por clase</th><th class="n">Total</th></tr></thead><tbody>${filas.map(f => `<tr class="click" data-act="pago-ver" data-id="${esc(f.pid)}"><td><b>${esc(profN(f.pid))}</b></td><td class="n num">${f.n}</td><td class="n">${f.ex || '—'}</td><td class="n">${f.m ? money(f.m) : '<span class="bad-t">sin cargar</span>'}</td><td class="n num"><b>${money(f.tot)}</b></td></tr>${S.ui.pagoVer === f.pid ? `<tr><td colspan="5" style="padding:0 0 10px"><div class="rows">${f.l.map(c => `<div class="row"><div class="t">${dkDe(c.fecha)} ${dm(c.fecha)} · ${esc(c.turno)} · ${esc(gName(c.grupo_id))}<small>Lista a las ${horaDe(c.dictada_en) || '—'}${cambioDe(c)?.estado === 'aprobado' && cambioDe(c).profe_antes ? ' · reemplazo de ' + esc(primerN(cambioDe(c).profe_antes)) : ''}${!c.materia ? ' · fuera del horario' : ''}${c.materia === 'examen' ? ' · examen, no suma' : ''}${c.obs ? ' · ' + esc(c.obs) : ''}</small></div><div class="r">${mchip(c.materia)}</div></div>`).join('')}</div></td></tr>` : ''}`).join('') || '<tr><td colspan="5" class="muted">Ningún profe llamó lista en este mes.</td></tr>'}</tbody></table></div><div class="card-b"><small class="muted">Tocá un profe para ver sus clases. Los exámenes que cuidó se ven, pero no suman al pago.</small></div></div>`;
  if (sinLista.length) h += `<div class="card"><div class="card-h"><h2>Clases sin lista</h2><small>Si el profe vino y firmó en papel, tocá la clase y marcá quién la dio</small></div><div class="rows">${sinLista.map(c => `<div class="row click" data-act="clase-editar" data-id="${esc(c.id)}"><div class="t">${dkDe(c.fecha)} ${dm(c.fecha)} · ${esc(c.turno)} · ${esc(gName(c.grupo_id))}<small>${esc(matL(c.materia))}${c.profesor_id ? ' · le tocaba a ' + esc(profN(c.profesor_id)) : ' · sin cobertura'}</small></div><div class="r">${pill('Sin lista', 'bad')}</div></div>`).join('')}</div></div>`;
  return h;
}

/* vista del profe */

  if (!S.miProf) return ph('Horario', '') + `<div class="card"><div class="empty"><b>Tu cuenta todavía no está vinculada al plantel de profes</b>Entraste con <b>${esc(S.perfil.email)}</b>. Avisale a la dirección: le aparece tu cuenta en Horario → Plantel para vincularla a tu fila (así conservás tus puntajes).<br><br><button class="btn primary" data-act="recargar-todo">Ya me vincularon: volver a cargar</button></div></div>`;
  const me = S.miProf.id, l = lunesDe(hoy());
  let h = ph('Horario', 'Tus clases y tu disponibilidad', `<button class="btn" data-act="cambio-nuevo">${ic('plus')}Pedir cambio</button>`);
  const mias = Object.values(S.clases).filter(c => (c.profesor_id === me || c.dictada_por === me) && c.fecha >= l && c.fecha <= addDays(l, 13));
  // pedidos pendientes de clases que todavía no están a su nombre
  const pc = Object.values(S.cambios || {}).filter(x => x.profesor_id === me && x.estado === 'pendiente' && x.fecha >= l && x.fecha <= addDays(l, 13) && !mias.some(c => c.grupo_id === x.grupo_id && c.fecha === x.fecha && c.turno === x.turno))
    .map(x => ({ ...(claseDe(x.grupo_id, x.fecha, x.turno) || {}), grupo_id: x.grupo_id, fecha: x.fecha, turno: x.turno, _pedido: x }));
  const todas = [...mias, ...pc].sort((a, b) => a.fecha.localeCompare(b.fecha) || a.turno.localeCompare(b.turno));
  h += `<div class="card"><div class="card-h"><h2>Tus clases</h2><small>Esta semana y la que viene</small></div><div class="rows">${todas.map(rowClaseProfe).join('') || '<div class="empty">No tenés clases publicadas en estas dos semanas.</div>'}</div></div>`;

  if (mp.length) h += `<div class="card"><div class="card-h"><h2>Tus pedidos de cambio</h2></div><div class="rows">${mp.map(x => `<div class="row"><div class="t">${dkDe(x.fecha)} ${dm(x.fecha)} · ${esc(x.turno)} · ${esc(gName(x.grupo_id) || 'Grupo')}<small>${x.motivo ? esc(x.motivo) : 'Sin motivo'}${x.profe_antes ? ' · le tocaba a ' + esc(primerN(x.profe_antes)) : ''}</small></div><div class="r">${pill(...ESTADO_CAMBIO[x.estado])}</div></div>`).join('')}</div></div>`;
  h += cardMiDisp();
  const mes = hoy().slice(0, 7); const dadas = Object.values(S.clases).filter(c => c.dictada_por === me && c.fecha.startsWith(mes)).sort((a, b) => b.fecha.localeCompare(a.fecha) || b.turno.localeCompare(a.turno));
  const nOk = dadas.filter(cuentaPago).length;
  h += `<div class="card"><div class="card-h"><h2>Clases que diste en ${MESES[+mes.slice(5) - 1]}</h2>${pill(nOk + ' clase' + (nOk === 1 ? '' : 's'), 'acc')}</div><div class="rows">${dadas.map(c => `<div class="row"><div class="t">${dkDe(c.fecha)} ${dm(c.fecha)} · ${esc(c.turno)} · ${esc(gName(c.grupo_id))}<small>Lista a las ${horaDe(c.dictada_en)}${c.materia === 'examen' ? ' · examen' : ''}${c.materia !== 'examen' && !cuentaPago(c) ? ' · cambio sin aprobar, todavía no cuenta' : ''}</small></div><div class="r">${mchip(c.materia)}</div></div>`).join('') || '<div class="empty">Todavía no llamaste lista este mes. Cada vez que llamás lista, la clase queda registrada acá.</div>'}</div></div>`;
  return h;
}
function rowClaseProfe(c) {
  const me = S.miProf.id, t = hoy(); let r = ''; const x = c._pedido || null;
  if (c.dictada_por === me) r = pill('✓ Lista ' + horaDe(c.dictada_en), 'ok') + (c.profesor_id !== me && c.materia !== 'examen' ? pill('Falta aprobar', 'pend') : '');
  else if (x && c.fecha === t) r = pill('Falta aprobar', 'pend') + `<button class="btn sm primary" data-act="tomar" data-g="${esc(c.grupo_id)}" data-t="${esc(c.turno)}">${ic('check')}Llamar lista</button>`;
  else if (x) r = pill('Pedido · falta aprobar', 'pend');
  else if (c.dictada_por) r = pill('La dio ' + primerN(c.dictada_por));
  else if (c.materia === 'examen') r = pill('Examen');
  else if (c.fecha === t) r = `<button class="btn sm primary" data-act="tomar" data-g="${esc(c.grupo_id)}" data-t="${esc(c.turno)}">${ic('check')}Llamar lista</button>`;
  else if (c.fecha < t) r = pill('Sin lista', 'bad');
  return `<div class="row"><div class="t">${c.fecha === t ? '<b>Hoy</b>' : dkDe(c.fecha) + ' ' + dm(c.fecha)} · ${esc(c.turno)} · ${esc(gName(c.grupo_id))}<small>${c.materia ? esc(matL(c.materia)) : 'Sin clase publicada'}${c.tema ? ' — ' + esc(c.tema) : ''}${x ? ' · pedido de cambio' : ''}${tieneNotas(c) ? ' · ✎ con observaciones' : ''}</small></div><div class="r">${r}</div></div>`;
}

/* horario del alumno: materia y tema, sin el profe */

  const l = lunesDe(hoy());
  [[l, 'Esta semana'], [addDays(l, 7), 'La semana que viene']].forEach(([ls, tit]) => {

};

async function invocar(fn, body) {
  try {
    const { data, error } = await S.sb.functions.invoke(fn, { body });
    if (error) { let m = error.message; try { const j = await error.context.json(); m = j.error || m; } catch (e) { } return { error: m }; }
    if (data && data.error) return { error: data.error };
    return data || { ok: true };
  } catch (e) { return { error: errText(e) }; }
}

  const rows = [['N°', 'Fecha', 'Alumno', 'CI', 'Grupo', 'Concepto', 'Monto', 'Forma de pago', 'Observación', 'Registró']];
  list.sort((a, b) => num(a.nro) - num(b.nro)).forEach(p => { const a = S.alumnos[p.alumnoId] || {}; rows.push([p.nro, fmtF(p.fecha), a.id ? nombreA(a) : '', a.ci || '', gName(p.grupoId), p.concepto, p.monto, p.metodo, p.obs, who(p.por)]); });
  guardarArchivo(nombre + '.csv', csv(rows));
}

  'ver-examen': el => go('examenes', () => { S.ui.exSel = el.dataset.id; S.draftExam = null; }),
  'back-examenes': () => { const f = () => { S.ui.exSel = null; S.draftExam = null; render(); }; if (S.draftExam?.dirty) confirmDlg('Hay notas sin guardar. ¿Salir igual?', 'Salir sin guardar', f); else f(); },
  'examen-guardar': async el => {
    const nombre = $('#x-nom').value.trim(); if (!nombre) { $('#x-err').textContent = 'Poné un nombre.'; return; }
    const eid = el.dataset.id; const row = { nombre, grupo_id: $('#x-gru').value, materia: $('#x-mat').value.trim() || null, fecha: $('#x-fec').value || null, maximo: Math.max(1, num($('#x-max').value) || 100) };
    if (!row.grupo_id) { $('#x-err').textContent = 'Elegí el grupo.'; return; }
    el.classList.add('disabled');
    const q = eid ? S.sb.from('examenes').update(row).eq('id', eid).select().single() : S.sb.from('examenes').insert(row).select().single();
    const r = await run(q, 'Examen guardado'); if (!r) { el.classList.remove('disabled'); return; }
    closeModal(); S.ui.exGrupo = r.grupo_id; S.ui.exSel = r.id; S.draftExam = null; await load(['exams']);
  },
  'examen-borrar': el => { const id = el.dataset.id; confirmDlg('¿Borrar este examen y todas sus notas?', 'Borrar examen', async () => { if (await run(S.sb.from('examenes').delete().eq('id', id), 'Examen borrado')) { S.ui.exSel = null; S.draftExam = null; await load(['exams']); } }); },
  'notas-guardar': async el => {
    const D = S.draftExam; const e = S.exams[D.eid]; if (!e) return;
    const filas = [], quitar = [];
    Object.entries(D.notas).forEach(([k, v]) => { const s = String(v ?? '').replace(',', '.').trim(); if (s !== '' && isFinite(+s) && +s >= 0) filas.push({ examen_id: e.id, alumno_id: k, nota: +s }); else if (e.notas[k] !== undefined) quitar.push(k); });
    const malas = Object.entries(D.notas).filter(([, v]) => { const s = String(v ?? '').replace(',', '.').trim(); return s !== '' && (!isFinite(+s) || +s < 0 || +s > e.max); });
    if (malas.length) { toast(`Hay ${malas.length} nota(s) fuera de rango (0 a ${e.max}).`, 'error'); return; }
    el.classList.add('disabled');
    let ok = true;
    if (filas.length) ok = !!(await run(S.sb.from('notas').upsert(filas, { onConflict: 'examen_id,alumno_id' })));
    if (ok && quitar.length) ok = !!(await run(S.sb.from('notas').delete().eq('examen_id', e.id).in('alumno_id', quitar)));
    if (!ok) { el.classList.remove('disabled'); return; }
    D.dirty = false; toast('Notas guardadas'); await load(['exams']);
  },
  'invitar-equipo': () => openInvitarEquipo(),
  'equipo-invitar': async el => {
    const email = $('#e-email').value.trim().toLowerCase(); if (!/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(email)) { $('#e-err').textContent = 'Revisá el correo.'; return; }
    el.classList.add('disabled'); $('#e-err').textContent = '';
    const r = await invocar('invitar', { tipo: 'oficina', email, nombre: $('#e-nom').value.trim(), grupos: [] });
    if (r.error) { $('#e-err').textContent = r.error; el.classList.remove('disabled'); return; }
    closeModal(); toast('Invitación enviada a ' + email); load(['perfiles']);
  },
  'equipo-editar': el => openEquipoEditar(el.dataset.id),
  'equipo-guardar': async el => {
    const pid = el.dataset.id; const p = S.perfiles[pid]; const soyYo = pid === S.session.user.id;
    const cambios = { nombre: $('#q-nom').value.trim() }; if (!soyYo) { cambios.rol = $('#q-rol').value; cambios.activo = $('#q-act').checked; }
    el.classList.add('disabled');
    const ok = !!(await run(S.sb.from('perfiles').update(cambios).eq('id', pid)));
    if (!ok) { el.classList.remove('disabled'); return; }
    closeModal(); toast('Cambios guardados'); load(['perfiles']);
  },
  'equipo-reenviar': async el => {
    const p = S.perfiles[el.dataset.id]; el.classList.add('disabled');
    const r = await invocar('invitar', { tipo: p.rol === 'profe' ? 'profe' : 'oficina', email: p.email, reenviar: true });
    el.classList.remove('disabled'); if (r.error) toast(r.error, 'error'); else toast('Correo enviado a ' + p.email);
  },
  'cfg-guardar': () => guardarCfg({ nombre: $('#c-nombre').value.trim(), tel: $('#c-tel').value.trim(), dir: $('#c-dir').value.trim(), transf: $('#c-transf').value.trim() }, 'Datos guardados'),
  'msg-guardar': () => guardarCfg({ msg: $('#c-msg').value }, 'Mensaje guardado'),
  'msg-reset': () => { $('#c-msg').value = DEFAULT_MSG; },
  'logo-quitar': () => guardarCfg({ logo: null }, 'Logo quitado'),
  importar: el => openImport(el.dataset.g),
  'imp-pegado': () => { const rows = parseTexto($('#imp-paste').value); if (rows.length < 2) { $('#imp-err').textContent = 'Pegá al menos la fila de títulos y una fila de datos, o elegí un archivo.'; return; } IMP.rows = rows; IMP.map = rows[0].map(autoMap); IMP.sheets = null; IMP.step = 2; renderImport(); },
  'imp-volver': () => { IMP.step = 1; renderImport(); },
  'imp-go': async () => {
    const { nuevos } = buildImport(); IMP.step = 3; renderImport(); IMP.ok = 0; IMP.fail = 0;
    const filas = nuevos.map(o => ({ ...aSnake(o), ficha: o.ficha || {}, grupo_id: o.grupoId, programa: S.grupos[o.grupoId]?.programa || null, estado: 'activo', ficha_completa: true, ficha_fecha: new Date().toISOString() }));
    for (let i = 0; i < filas.length; i += 50) {
      const lote = filas.slice(i, i + 50);
      const { error } = await S.sb.from('alumnos').insert(lote);
      if (error) { IMP.fail += lote.length; IMP.errMsg = errText(error); } else IMP.ok += lote.length;
      const b = $('#imp-bar'); if (b) b.style.width = Math.round(Math.min(filas.length, i + 50) / filas.length * 100) + '%';
    }
    IMP.step = 4; renderImport(); if (IMP.errMsg) toast(IMP.errMsg, 'error'); load(['alumnos']);
  },
  'exp-pagos': () => expPagos(Object.values(S.pagos).filter(p => (p.fecha || '').startsWith(S.ui.cobMes) && (!S.ui.cobGrupo || p.grupoId === S.ui.cobGrupo)), 'Pagos ' + S.ui.cobMes),
  'exp-pagos-todos': () => expPagos(Object.values(S.pagos), 'Pagos VIBE ' + hoy()),
  'exp-alumnos': () => {
    const extras = FICHA.filter(f => f.k && !f.col);
    const rows = [['Curso', 'Nombre', 'Apellido', 'Correo', 'CI', 'Nacimiento', 'Teléfono', 'Colegio', 'Ciudad', 'Encargado', 'Tel. encargado', ...extras.map(f => f.l), 'Grupo', 'Estado', 'Descuento %', 'Cuota especial', 'Vencido', 'Por vencer', 'Pagado', 'Asistencia %', 'Alta', 'Observaciones']];
    Object.values(S.alumnos).sort((a, b) => gName(a.grupoId).localeCompare(gName(b.grupoId)) || cmpA(a, b)).forEach(a => { const c = cuenta(a); const as = asisAlumno(a); rows.push([progDe(a), a.nombre, a.apellido, a.email, a.ci, fmtF(a.fechaNac), a.tel, a.colegio, a.ciudad, a.encargado, a.encargadoTel, ...extras.map(f => a.ficha?.[f.k] || ''), gName(a.grupoId), a.estado, a.desc || '', a.cuotaEsp || '', c.vencido, c.pendiente, c.pagado, as.pct ?? '', fmtF(a.inscripcion), a.obs]); });
    guardarArchivo('Alumnos VIBE ' + hoy() + '.csv', csv(rows));
  },
  'exp-asis': () => {
    const rows = [['Fecha', 'Turno', 'Grupo', 'Alumno', 'Marca']]; const L = { P: 'Presente', A: 'Ausente', T: 'Tarde', J: 'Justificada' };
    Object.values(S.asis).sort((a, b) => (a.fecha || '').localeCompare(b.fecha || '') || (a.turno || '').localeCompare(b.turno || '')).forEach(d => Object.entries(d.marcas || {}).forEach(([aid, m]) => { const a = S.alumnos[aid]; if (a) rows.push([fmtF(d.fecha), d.turno || 'Mañana', gName(d.grupoId), nombreA(a), L[m] || m]); }));
    guardarArchivo('Asistencia VIBE ' + hoy() + '.csv', csv(rows));
  },
  'ficha-guardar': async el => {
    const { datos, falta } = leerFicha('f'); if (falta) { $('#f-err').textContent = 'Completá los campos marcados con *.'; falta.focus(); return; }
    el.classList.add('disabled'); $('#f-err').textContent = '';
    const r = await run(S.sb.rpc('guardar_mi_ficha', { datos }));
    if (!r) { el.classList.remove('disabled'); return; }
    const primera = Array.isArray(r) ? r[0]?.primera_vez : r?.primera_vez;
    if (primera) invocar('notificar', {}).then(x => { if (x.error) console.warn('Aviso por correo:', x.error); });
    toast('¡Listo! Tu ficha quedó guardada.'); await load(['alumnos']); go('mi-inicio');
  },
  'datos-guardar': async el => {
    const { datos, falta } = leerFicha('md'); if (falta) { $('#md-err').textContent = 'Completá los campos marcados con *.'; falta.focus(); return; }
    el.classList.add('disabled'); $('#md-err').textContent = '';
    const r = await run(S.sb.rpc('guardar_mi_ficha', { datos }), 'Datos guardados'); el.classList.remove('disabled');
    if (r) await load(['alumnos']);
  }
};
const IN = {
  q: el => { S.ui.q = el.value; sched(); },
  pf: el => { const it = PF.items[+el.dataset.i]; if (!it) return; const k = el.dataset.k; it[k] = k === 'monto' ? parseMoney(el.value) : el.value; const t = $('#pf-total'); if (t) t.textContent = 'Total ' + money(sum(PF.items.map(i => i.monto))); },
  nota: el => { const D = S.draftExam; if (!D) return; D.notas[el.dataset.id] = el.value; D.dirty = true; const sb = el.closest('.card').querySelector('.savebar'); if (sb) { sb.querySelector('small').textContent = 'Hay cambios sin guardar'; sb.querySelector('.btn').classList.remove('disabled'); } },
  'wa-msg': () => { $('#wa-btn').innerHTML = waBtn(); },
  'asis-nota': el => { const D = S.draftAsis; if (!D) return; D.nota = el.value; asisDirty(); },
  'ev-com': el => { (S.evR[el.dataset.c] ||= {}).comentario = el.value; }
};
// marca la lista como modificada sin re-renderizar (para no perder el foco del cuadro de texto)
function asisDirty() { const D = S.draftAsis; if (!D) return; D.dirty = true; const b = $('[data-act="asis-guardar"]'); if (b) { b.classList.remove('disabled'); b.textContent = 'Guardar lista'; } }
const CH = {
  fGrupo: el => { S.ui.fGrupo = el.value; render(); },
  fEstado: el => { S.ui.fEstado = el.value; render(); },
  fDeuda: el => { S.ui.fDeuda = el.checked; render(); },
  asisFecha: el => { const v = el.value || hoy(); if (S.draftAsis?.dirty) { el.value = S.ui.asisFecha; confirmDlg('La lista tiene cambios sin guardar. ¿Descartarlos?', 'Descartar', () => { S.draftAsis = null; S.ui.asisFecha = v; render(); }); return; } S.ui.asisFecha = v; render(); },
  histGrupo: el => { S.ui.histGrupo = el.value; render(); },
  'pool-tema': el => { const it = (S.pool[el.dataset.g] || [])[+el.dataset.i]; if (!it) return; it.tema = el.value.trim(); guardarPool(el.dataset.g); },
  'pool-dia': el => { const it = (S.pool[el.dataset.g] || [])[+el.dataset.i]; if (!it) return; if (el.value) it.dia = el.value; else delete it.dia; render(); guardarPool(el.dataset.g); },
  'pool-nivel': el => { const it = (S.pool[el.dataset.g] || [])[+el.dataset.i]; if (!it) return; if (el.value) it.nivel = el.value; else delete it.nivel; render(); guardarPool(el.dataset.g); },
  pagoMes: el => { S.ui.pagoMes = el.value || hoy().slice(0, 7); S.ui.pagoVer = ''; render(); },
  'cb-g': el => { CB.g = el.value; renderCambio(); },
  ofiMes: el => { S.ui.ofiMes = el.value || hoy().slice(0, 7); render(); },
  evMes: el => { S.ui.evMes = el.value || hoy().slice(0, 7); render(); },
  omonto: async el => { const u = el.dataset.u, v = parseMoney(el.value); if (await run(S.sb.from('oficina_montos').upsert({ user_id: u, monto_turno: v }), 'Pago por turno guardado')) { S.oMontos[u] = v; render(); } },
  'cb-f': el => { CB.f = el.value || hoy(); renderCambio(); },
  'cb-t': el => { CB.t = el.value; infoCambio(); },
  cobGrupo: el => { S.ui.cobGrupo = el.value; render(); },
  'pg-al': el => { PG.aid = el.value; PG.itemId = ''; $('#pg-body').innerHTML = pagoBody(); },
  'pg-item': el => { PG.itemId = el.value; $('#pg-body').innerHTML = pagoBody(); },
  'k-gru': el => { const p = S.grupos[el.value]?.programa; if (p && PROGRAMAS.includes(p)) $('#k-prog').value = p; if (!$('#k-tit').value && el.value) $('#k-tit').value = gName(el.value); },
  'i-gru': el => { const p = S.grupos[el.value]?.programa; if (p && PROGRAMAS.includes(p)) $('#i-prog').value = p; },
  logo: async el => {
    const f = el.files && el.files[0]; if (!f) return;
    try { const url = await new Promise((res, rej) => { const fr = new FileReader(); fr.onload = () => res(fr.result); fr.onerror = rej; fr.readAsDataURL(f); });
      const im = new Image(); im.src = url; await im.decode(); const sc = Math.min(1, 400 / im.width, 160 / im.height);
      const cv = document.createElement('canvas'); cv.width = Math.round(im.width * sc); cv.height = Math.round(im.height * sc); cv.getContext('2d').drawImage(im, 0, 0, cv.width, cv.height);
      let out = cv.toDataURL('image/png'); if (out.length > 180000) out = cv.toDataURL('image/jpeg', .85);
      guardarCfg({ logo: out }, 'Logo guardado');
    } catch (e) { toast('No se pudo leer esa imagen.', 'error'); }
  },
  'imp-file': async el => {
    const f = el.files && el.files[0]; if (!f) return; const err = $('#imp-err');
    try {
      if (/\.csv$/i.test(f.name)) { const rows = parseTexto(await f.text()); IMP.rows = rows; IMP.map = (rows[0] || []).map(autoMap); IMP.sheets = null; IMP.step = 2; renderImport(); return; }
      if (err) err.textContent = 'Leyendo el archivo…';
      await loadXLSX(); const wb = XLSX.read(await f.arrayBuffer(), { type: 'array', cellDates: true }); IMP.wb = wb; IMP.sheets = wb.SheetNames;
      const first = wb.SheetNames.find(n => (XLSX.utils.sheet_to_json(wb.Sheets[n], { header: 1 }) || []).length > 1) || wb.SheetNames[0];
      setSheet(first); renderImport();
    } catch (e) { if (err) err.textContent = 'No pude leer ese archivo. Probá guardarlo como .xlsx o copiar y pegar las filas.'; }
  },
  'imp-sheet': el => { setSheet(el.value); renderImport(); },
  'imp-grupo': el => { IMP.gid = el.value; renderImport(); },
  'imp-map': el => { IMP.map[+el.dataset.i] = el.value; renderImport(); }
};
const FORMS = {
  registro: async f => {
    const email = $('#r-email').value.trim().toLowerCase(), p1 = $('#r-pass').value, p2 = $('#r-pass2').value;
    if (p1.length < 6) { $('#r-err').textContent = 'La contraseña tiene que tener al menos 6 caracteres.'; return; }
    if (p1 !== p2) { $('#r-err').textContent = 'Las contraseñas no coinciden.'; return; }
    const b = f.querySelector('button'); b.classList.add('disabled'); $('#r-err').textContent = '';
    const { data, error } = await S.sb.auth.signUp({ email, password: p1, options: { data: { codigo: CODIGO }, emailRedirectTo: APP_URL } });
    b.classList.remove('disabled');
    if (error) { $('#r-err').textContent = errText(error); return; }
    if (data?.user && Array.isArray(data.user.identities) && !data.user.identities.length) { S.authView = 'login'; S.authOk = false; S.authMsg = 'Ese correo ya tiene cuenta. Entrá con tu contraseña y te inscribimos.'; render(); return; }
    if (!data?.session) { S.registroEnviado = email; render(); }
  },
  login: async f => {
    const email = $('#l-email').value.trim(), password = $('#l-pass').value; const b = f.querySelector('button'); b.classList.add('disabled');
    const { error } = await S.sb.auth.signInWithPassword({ email, password });
    b.classList.remove('disabled'); if (error) { S.authMsg = errText(error); S.authOk = false; render(); }
  },
  olvide: async f => {
    const email = $('#l-email').value.trim(); const b = f.querySelector('button'); b.classList.add('disabled');
    const { error } = await S.sb.auth.resetPasswordForEmail(email, { redirectTo: location.origin + location.pathname });
    S.authOk = !error; S.authMsg = error ? errText(error) : 'Listo. Si el correo está registrado, te llega un enlace en unos minutos (revisá también Spam).'; render();
  },
  clave: async () => {
    const p1 = $('#n-pass').value, p2 = $('#n-pass2').value; if (p1.length < 6) { $('#n-err').textContent = 'Mínimo 6 caracteres.'; return; } if (p1 !== p2) { $('#n-err').textContent = 'Las contraseñas no coinciden.'; return; }
    const { error } = await S.sb.auth.updateUser({ password: p1 }); if (error) { $('#n-err').textContent = errText(error); return; }
    S.needPassword = false; toast('Contraseña guardada'); history.replaceState(null, '', location.pathname); render();
  },
  clave2: async f => {
    const p1 = $('#c2-pass').value, p2 = $('#c2-pass2').value; if (p1.length < 6) { $('#c2-err').textContent = 'Mínimo 6 caracteres.'; return; } if (p1 !== p2) { $('#c2-err').textContent = 'Las contraseñas no coinciden.'; return; }
    const { error } = await S.sb.auth.updateUser({ password: p1 }); if (error) { $('#c2-err').textContent = errText(error); return; }
    f.reset(); $('#c2-err').textContent = ''; toast('Contraseña cambiada');
  }
};
document.addEventListener('click', e => {
  const el = e.target.closest('[data-act]'); if (!el) return; const fn = A[el.dataset.act]; if (!fn) return;
  if (el.tagName === 'BUTTON' || el.tagName === 'A') e.preventDefault();
  fn(el, e);
});
document.addEventListener('submit', e => { const f = e.target; const k = f.dataset.form; if (k && FORMS[k]) { e.preventDefault(); FORMS[k](f); } });
document.addEventListener('input', e => { const k = e.target.dataset && e.target.dataset.in; if (k && IN[k]) IN[k](e.target, e); });
document.addEventListener('change', e => {
  const t = e.target; if (t.classList && t.classList.contains('money')) { const v = parseMoney(t.value); t.value = v ? fmtN(v) : ''; }
  const k = t.dataset && t.dataset.ch; if (k && CH[k]) CH[k](t, e);
});
document.addEventListener('keydown', e => { if (e.key === 'Escape' && modalOpen()) closeModal(); });
window.addEventListener('beforeunload', e => { if (hasDraft()) { e.preventDefault(); e.returnValue = ''; } });

render();
iniciar();
</script>
